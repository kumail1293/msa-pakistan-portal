services:
  - type: web
    name: msap-portal
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: PORTAL_BASE_URL
        value: https://portal.msapakistan.org
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
